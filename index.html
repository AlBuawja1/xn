            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-card {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            border: 4px solid #fff;
        }

        h2 { color: #333; margin: 10px 0 5px 0; font-size: 22px; font-weight: 800; }
        .sub-title { color: #764ba2; margin-bottom: 25px; font-size: 18px; font-weight: bold; display: block; }
        .search-area { background: #f8f9fa; padding: 20px; border-radius: 20px; border: 1px solid #eee; }
        input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; box-sizing: border-box; text-align: center; font-weight: bold; }
        button { background: var(--btn-grad); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 17px; font-weight: bold; width: 100%; margin-top: 15px; }

        .result-box { background: #fff; border-radius: 15px; padding: 20px; margin-top: 20px; display: none; border: 2px solid #764ba2; text-align: right; }
        .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .label { color: #777; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .value-name { color: #2c3e50; font-weight: 900; font-size: 18px; } 
        .success { color: #27ae60; font-weight: bold; background: #ebfaef; padding: 4px 10px; border-radius: 8px; }
        .failed { color: #e74c3c; font-weight: bold; background: #fdf2f2; padding: 4px 10px; border-radius: 8px; }
        
        /* تنسيق رسالة التحذير */
        .warning-msg {
            color: #856404;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;

        .total-header { text-align: center; color: #764ba2; font-weight: bold; border-bottom: 2px solid #eee; margin-bottom: 10px; padding-bottom: 10px; }

        .designer-credit {
            margin-top: 25px;
            font-size: 14px;
            font-weight: bold;
            background: var(--btn-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
    </style>

    function doSearch() {
        const inputVal = document.getElementById('nameInput').value.trim();
        const box = document.getElementById('result');
        
        // إذا كان الحقل فارغاً
        if(!inputVal) { 
            box.style.display = "none"; 
            return; 
        }

        // 1. فحص إذا كان المطلوب هو التقرير الإجمالي
        if(inputVal === "إجمالي" || inputVal === "اجمالي") {
            const count = members.length;
            const total = members.reduce((acc, curr) => acc + curr.p, 0);
            const today = new Date().toLocaleDateString('ar-LY', { year: 'numeric', month: 'long', day: 'numeric' });

            box.innerHTML = `
                <div class="total-header">📊 تقرير حالة الصندوق</div>
                <div class="data-row"><span class="label">👥 إجمالي المشتركين:</span><span class="value-name">${count}</span></div>
                <div class="data-row"><span class="label">💰 إجمالي الرصيد:</span><span class="value-name" style="color:#27ae60;">${total} د.ل</span></div>
                <div class="data-row"><span class="label">📅 تاريخ اليوم:</span><span class="value-name" style="font-size:15px; color:#555;">${today}</span></div>
            `;
            box.style.display = "block";
            return;
        }

        // 2. التحقق من كتابة اسم ثنائي على الأقل (باستثناء كلمة إجمالي)
        const nameParts = inputVal.split(/\s+/).filter(part => part.length > 0);
        if (nameParts.length < 2) {
            box.innerHTML = `<div class="warning-msg">⚠️ يرجى كتابة الاسم الأول والثاني (مثلاً: محمد علي) لتتم عملية البحث بدقة.</div>`;
            box.style.display = "block";
            return;
        }

        // 3. تطبيع النصوص للبحث (تجاهل الهمزات والتاء المربوطة)
        const normalize = (t) => t.replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, '');
        const sNorm = normalize(inputVal);
        const found = members.find(m => normalize(m.n).includes(sNorm));

        if(found) {
            const sClass = found.paid ? "success" : "failed";
            box.innerHTML = `
                <div class="data-row"><span class="label">👤 اسم العضو:</span><span class="value-name">${found.n}</span></div>
                <div class="data-row"><span class="label">💵 المسدد:</span><span class="value-name">${found.p} د.ل</span></div>
                <div class="data-row"><span class="label">📝 الحالة:</span><span class="${sClass}">${found.s}</span></div>
                <div class="data-row"><span class="label">📅 التاريخ:</span><span class="value-name" style="font-size:15px;">${found.d}</span></div>
            `;
            box.style.display = "block";
        } else {
            box.innerHTML = `<div style="color:#e74c3c; text-align:center; padding:15px; font-weight:bold;">❌ العضو غير مسجل</div>`;
            box.style.display = "block";
        }
    }

    // تفعيل البحث عند الضغط على زر Enter
    document.getElementById('nameInput').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') doSearch(); 
    });
